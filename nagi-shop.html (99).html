<style>
::-webkit-scrollbar{display:none}
.glass-header{background:rgba(255,255,255,.95);backdrop-filter:blur(10px)}

<body class="bg-gray-50 text-gray-800 pb-20">

<!-- Header -->
<header class="sticky top-0 z-40 glass-header shadow-sm px-4 py-3 flex items-center justify-between">
  <div class="flex items-center gap-2">
    <img src="https://ui-avatars.com/api/?name=NAGI&background=0ea5e9&color=fff&rounded=true" class="w-10 h-10 rounded-full border-2 border-brand" alt="Logo">
    <span class="font-bold text-lg tracking-wide">NAGI SHOP</span>
  </div>
  <div class="flex items-center gap-3">
    <a data-contact href="https://www.facebook.com/share/1DYtLkHpai/" target="_blank" class="text-brand text-xl"><i class="fa-regular fa-comment-dots"></i></a>
    <button id="bell" data-act="notifs" class="relative text-gray-500 text-xl hidden"><i class="fa-regular fa-bell"></i><span id="bellBadge" class="absolute -top-1 -right-2 bg-red-500 text-white text-[10px] rounded-full px-1 hidden">0</span></button>

  </div>
</header>
<div id="announce" class="hidden bg-amber-100 text-amber-800 text-xs text-center py-1.5 px-3"></div>

<!-- Side menu -->
<div id="sideMenu" class="fixed inset-0 bg-black/50 z-50 hidden">
  <div id="menuContent" class="bg-white w-4/5 h-full rounded-r-2xl p-6 shadow-xl -translate-x-full transition-transform duration-300">
    <div class="flex items-center justify-between mb-8 border-b pb-4">
      <span class="font-bold text-lg">NAGI SHOP</span>
      <button data-act="menu" class="text-gray-400"><i class="fa-solid fa-xmark text-2xl"></i></button>
    </div>
    <nav class="space-y-4 text-gray-700 font-medium">
      <a data-act="home" class="flex items-center gap-4"><i class="fa-solid fa-house w-6"></i> ໜ້າຫຼັກ</a>
      <a data-act="topup" class="flex items-center gap-4 text-brand"><i class="fa-solid fa-wallet w-6"></i> ເຕີມເງິນ</a>

    </nav>
  </div>
</div>

<main class="px-4 py-4 space-y-6">
  <div>
    <div class="flex items-center gap-2 mb-3">
      <span class="bg-blue-100 text-brand px-3 py-1 rounded-lg text-sm font-semibold"><i class="fa-solid fa-layer-group mr-1"></i> ໝວດໝູ່ສິນຄ້າ</span>

    <div class="relative">
      <i class="fa-solid fa-magnifying-glass absolute left-4 top-3 text-gray-400"></i>
      <input id="search" type="text" placeholder="ຄົ້ນຫາສິນຄ້າ..." class="w-full bg-white border border-gray-200 rounded-xl py-2.5 pl-10 pr-4 text-sm outline-none focus:border-brand">
    </div>
  </div>

  <div id="banners" class="space-y-3">
    <div class="relative rounded-xl overflow-hidden shadow-sm h-28 bg-gradient-to-r from-blue-400 to-indigo-500 flex items-center p-4 text-white">

  <div id="pills" class="flex gap-2 overflow-x-auto pb-2"></div>

  <footer class="text-center text-xs text-gray-400 py-6 mt-8 border-t border-gray-200">
    <p>© 2026 NAGI SHOP</p>
    <p class="mt-1"><a data-act="terms" class="underline cursor-pointer">ເງື່ອນໄຂການໃຊ້ງານ</a></p>
    <div class="flex justify-center items-center gap-1 mt-2">
      <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span><span class="text-green-500 font-semibold">ONLINE</span>
    </div>
  </footer>
</main>

function toast(t, ok){
  const el = $('toast'); el.textContent = t;
  el.className = 'fixed top-16 left-1/2 -translate-x-1/2 z-[70] px-4 py-2 rounded-lg text-sm text-white shadow-lg ' + (ok ? 'bg-green-600' : 'bg-red-500');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.add('hidden'), 3500);
}
function openSheet(title, html){
  $('sheetTitle').textContent = title; $('sheetBody').innerHTML = html;
  $('sheet').classList.remove('hidden'); $('sheet').classList.add('flex');
}
function closeSheet(){ $('sheet').classList.add('hidden'); $('sheet').classList.remove('flex'); }
function toggleMenu(){
  const m = $('sideMenu'), c = $('menuContent');
  if (m.classList.contains('hidden')){ m.classList.remove('hidden'); setTimeout(() => c.classList.remove('-translate-x-full'), 10); }
  else { c.classList.add('-translate-x-full'); setTimeout(() => m.classList.add('hidden'), 300); }
}

async function loadProducts(){
  const { data, error } = await sb.from('products').select('*').order('game').order('price');
  if (error) { $('grid').innerHTML = `<p class="col-span-2 text-center text-red-500 text-sm">${esc(error.message)}</p>`; return; }
  S.products = data; renderProducts();
}
function renderProducts(){
  const games = [...new Set(S.products.map(p => p.game))];
  $('catCount').textContent = games.length + ' ໝວດໝູ່';
  const pill = (v, t) => `<button data-cat="${esc(v)}" class="${S.cat===v?'bg-brand text-white shadow-md':'bg-white text-gray-600 border border-gray-200'} px-4 py-1.5 rounded-full text-sm whitespace-nowrap">${esc(t)}</button>`;
  $('pills').innerHTML = pill('all','ທັງໝົດ') + games.map(g => pill(g,g)).join('');
  const q = S.q.toLowerCase();
  const list = S.products.filter(p => p.active && (S.cat==='all' || p.game===S.cat) && (p.name+' '+p.game).toLowerCase().includes(q));
  $('grid').innerHTML = list.length ? list.map(p => {
    const out = p.stock < 1;
    return `<div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col">
      <div class="relative h-32 bg-gray-100">
        <img src="${esc(p.image_url) || `https://ui-avatars.com/api/?name=${encodeURIComponent(p.game)}&background=eee&color=333`}" class="w-full h-full object-cover" alt="">
        ${out ? '<span class="absolute top-2 left-2 bg-red-500 text-white text-[10px] px-2 py-0.5 rounded">ສິນຄ້າໝົດ</span>' : ''}
      </div>
      <div class="p-3 flex flex-col flex-grow">
        <p class="text-[11px] text-gray-400">${esc(p.game)}</p>
        <h3 class="text-sm font-semibold line-clamp-2">${esc(p.name)}</h3>
        <p class="text-brand font-bold mt-1">${fmt(p.price)} K</p>
        <p class="mt-1 text-xs text-gray-500"><i class="fa-solid fa-box"></i> ເຫຼືອ ${p.stock} ອັນ</p>
        <button ${out?'disabled':''} data-buy="${p.id}" class="mt-3 w-full ${out?'bg-gray-300 cursor-not-allowed':'bg-brand'} text-white py-2 rounded-lg text-sm font-semibold">${out?'ສິນຄ້າໝົດ':'ຊື້ເລີຍ'}</button>
      </div></div>`;
  }).join('') : '<p class="col-span-2 text-center text-gray-400 text-sm py-6">ບໍ່ພົບສິນຄ້າ</p>';
}

  const { data } = await sb.from('profiles').select('*').eq('id', S.user.id).single();
  S.profile = data; updateHeader();
}

async function loadMyTopups(){
  const { data } = await sb.from('topup_requests').select('*').eq('user_id', S.user.id).order('created_at',{ascending:false}).limit(10);
  const el = $('tHist'); if (!el || !data?.length) return;
  el.innerHTML = '<p class="text-xs text-gray-400 mb-1">ລາຍການລ່າສຸດ</p>' + data.map(r => `
    <div class="flex justify-between py-2 border-b text-sm">
      <div><b>${fmt(r.amount)} K</b><div class="text-xs text-gray-400">${dt(r.created_at)}${r.status==='rejected'&&r.note ? ' · '+esc(r.note) : ''}</div></div>
      <span class="text-xs ${r.status==='approved'?'text-green-600':r.status==='rejected'?'text-red-500':'text-gray-500'}">${TS[r.status]||esc(r.status)}</span>
    </div>`).join('');
}
async function sha256(file){
  if (!crypto?.subtle) return null;
  const buf = await crypto.subtle.digest('SHA-256', await file.arrayBuffer());
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
}
async function submitTopup(){
  const btn = document.querySelector('[data-act="submitTopup"]');
  const amt = Number(($('tAmt').value || '').replace(/[, ]/g,''));
  const ref = $('tRef').value.trim();
  if (!(amt > 0)) return toast('ໃສ່ຈຳນວນເງິນໃຫ້ຖືກ');
  if (!T.file) return toast('ເລືອກຮູບສະລິບກ່ອນ');
  btn.disabled = true; btn.textContent = 'ກຳລັງສົ່ງ...';
  let path = null;
  try {
    const hash = await sha256(T.file);
    const blob = await compressImage(T.file, 1280);
    path = `${S.user.id}/${Date.now()}.jpg`;
    const up = await sb.storage.from('slips').upload(path, blob, { contentType: 'image/jpeg' });
    if (up.error) throw up.error;
    const { error } = await sb.rpc('request_topup', { p_amount: amt, p_slip_path: path, p_hash: hash, p_ref: ref || null });
    if (error) throw error;
    toast('ສົ່ງສະລິບແລ້ວ ລໍຖ້າແອດມິນກວດສອບ', true);
    topupSheet();
  } catch (e) {
    if (path) sb.storage.from('slips').remove([path]);
    toast(/duplicate|unique/i.test(e.message || '') ? 'ສະລິບ ຫຼື ເລກອ້າງອີງນີ້ຖືກສົ່ງແລ້ວ' : (e.message || 'ຜິດພາດ'));
    btn.disabled = false; btn.textContent = 'ສົ່ງສະລິບ';
  }
}
document.addEventListener('change', async e => {
  if (e.target.id !== 'tSlip' || !e.target.files[0]) return;
  T.file = e.target.files[0];
  const pv = $('tPrev'); pv.src = URL.createObjectURL(T.file); pv.classList.remove('hidden');
});

function compressImage(file, max=800){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('ຮູບບໍ່ຖືກຕ້ອງ')), 'image/jpeg', .85);
    };
    img.onerror = () => rej(new Error('ອ່ານຮູບບໍ່ໄດ້'));
    img.src = url;
  });
}

  if (!S.user) return;
  const { count } = await sb.from('notifications').select('id', { count:'exact', head:true }).eq('user_id', S.user.id).eq('read', false);
  const bd = $('bellBadge'); bd.textContent = count > 9 ? '9+' : (count || 0); bd.classList.toggle('hidden', !count);
}
async function notifSheet(){
  if (needLogin()) return;
  openSheet('ແຈ້ງເຕືອນ', '<p class="text-sm text-gray-400">ກຳລັງໂຫຼດ...</p>');
  const { data } = await sb.from('notifications').select('*').eq('user_id', S.user.id).order('created_at', { ascending:false }).limit(30);
  $('sheetBody').innerHTML = data?.length ? data.map(n => `
    <div class="py-3 border-b text-sm ${n.read ? '' : 'bg-blue-50 -mx-2 px-2'}"><b>${esc(n.title)}</b>
      <div class="text-gray-600">${esc(n.body || '')}</div><div class="text-xs text-gray-400">${dt(n.created_at)}</div></div>`).join('') : '<p class="text-sm text-gray-400">ຍັງບໍ່ມີແຈ້ງເຕືອນ</p>';
  await sb.from('notifications').update({ read:true }).eq('user_id', S.user.id).eq('read', false);
  refreshBell();
}
setInterval(refreshBell, 60000);

/* ---------- ແອດມິນ: ສະຖິຕິ / ຕັ້ງຄ່າ / CSV ---------- */
async function admStats(){
  const { data: d, error } = await sb.rpc('admin_stats');
  if (error) return $('admBody').innerHTML = `<p class="text-red-500 text-sm">${esc(error.message)}</p>`;
  const box = (t, x) => `<div class="bg-gray-50 rounded-xl p-3 flex justify-between items-center"><div><p class="text-xs text-gray-400">${t}</p><p class="font-bold text-brand">${fmt(x.sales)} K</p></div><div class="text-right text-xs text-gray-500">${x.orders} ອໍເດີ<br>ກຳໄລ ${fmt(x.profit)} K</div></div>`;
  const max = Math.max(1, ...d.days.map(x => Number(x.sales)));
  $('admBody').innerHTML = `
    <div class="space-y-2">${box('ມື້ນີ້', d.today)}${box('ເດືອນນີ້', d.month)}${box('ປີນີ້', d.year)}</div>
    <div class="grid grid-cols-3 gap-2 mt-2 text-center text-xs">
      <div class="bg-gray-50 rounded-xl p-2"><b>${fmt(d.customers)}</b><br>ລູກຄ້າ</div>
      <div class="bg-gray-50 rounded-xl p-2"><b>${fmt(d.total_balance)}</b><br>ຍອດລວມ</div>
      <div class="bg-gray-50 rounded-xl p-2"><b>${fmt(d.pending_topups)}</b><br>ລໍເຕີມເງິນ</div>
    </div>
    <p class="text-xs text-gray-400 mt-4">ຍອດຂາຍ 7 ວັນຜ່ານມາ</p>
    <div class="flex items-end gap-1 h-24 mt-1">${d.days.map(x => `<div class="flex-1 flex flex-col items-center justify-end h-full"><div class="w-full bg-brand rounded-t" style="height:${Math.round(Number(x.sales) / max * 100)}%"></div><span class="text-[9px] text-gray-400">${esc(x.d)}</span></div>`).join('')}</div>
    <p class="text-xs text-gray-400 mt-4">ສິນຄ້າຂາຍດີເດືອນນີ້</p>
    ${(d.top || []).map(t => `<div class="flex justify-between text-sm py-1.5 border-b"><span>${esc(t.name)}</span><span class="text-gray-500">${t.qty} ອັນ · ${fmt(t.rev)} K</span></div>`).join('') || '<p class="text-sm text-gray-400">ຍັງບໍ່ມີຂໍ້ມູນ</p>'}
    ${d.low?.length ? `<p class="text-xs text-red-500 mt-4">ສະຕັອກໃກ້ໝົດ: ${d.low.map(x => esc(x)).join(', ')}</p>` : ''}
    <p class="text-[10px] text-gray-400 mt-4">ກຳໄລຄິດຈາກຕົ້ນທຶນທີ່ໃສ່ໃນສິນຄ້າ (ຖ້າບໍ່ໃສ່ ຖືວ່າ 0)</p>`;
}
function admSettings(){
  $('admBody').innerHTML = `
    <p class="text-xs text-gray-500">ແບນເນີ (1 ບັນທັດ ຕໍ່ 1 ອັນ ຮູບແບບ ຫົວຂໍ້ນ້ອຍ|ຫົວຂໍ້ໃຫຍ່)</p>
    <textarea id="sBanners" rows="3" class="inp">${esc(CFG.banners || '')}</textarea>
    <p class="text-xs text-gray-500 mt-2">ແຖບປະກາດ (ວ່າງ = ບໍ່ສະແດງ)</p>
    <input id="sAnn" class="inp" value="${esc(CFG.announcement || '')}">
    <p class="text-xs text-gray-500 mt-2">ລິ້ງຕິດຕໍ່ (Facebook / WhatsApp ຂຶ້ນຕົ້ນດ້ວຍ https://)</p>
    <input id="sContact" class="inp" value="${esc(CFG.contact_url || CONTACT)}">
    <p class="text-xs text-gray-500 mt-2">ເງື່ອນໄຂການໃຊ້ງານ</p>
    <textarea id="sTerms" rows="6" class="inp">${esc(CFG.terms || TERMS_DEFAULT)}</textarea>
    <button data-adm="savecfg:" class="mt-4 w-full bg-brand text-white py-2.5 rounded-xl font-semibold">ບັນທຶກ</button>`;
}
async function admSaveCfg(btn){
  const c = $('sContact').value.trim();
  if (c && !/^https?:\/\//.test(c)) return toast('ລິ້ງຕ້ອງຂຶ້ນຕົ້ນດ້ວຍ https://');
  const rows = [['banners', $('sBanners').value], ['announcement', $('sAnn').value.trim()], ['contact_url', c], ['terms', $('sTerms').value]].map(([key, value]) => ({ key, value }));
  btn.disabled = true;
  const { error } = await sb.from('site_settings').upsert(rows);
  btn.disabled = false;
  if (error) return toast(error.message);
  toast('ບັນທຶກແລ້ວ', true); loadSettings();
}
async function admCsv(){
  const { data, error } = await sb.from('orders').select('*, products(name,game), profiles(full_name)').order('created_at', { ascending:false }).limit(5000);
  if (error) return toast(error.message);
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const csv = '\ufeff' + ['id,date,customer,game,product,price,status,game_id,delivered', ...data.map(o => [o.id, o.created_at, o.profiles?.full_name, o.products?.game, o.products?.name, o.price, o.status, o.game_id, o.delivered].map(q).join(','))].join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8' })); a.download = 'orders.csv'; a.click();
}

/* ---------- ເຫດການ ---------- */
const ACT = {
  menu: toggleMenu, close: closeSheet, auth: () => authSheet(), toLogin: () => authSheet('login'), toSignup: () => authSheet('signup'),
  doLogin, doSignup, forgot: forgotSheet, doForgot, doNewPass, admin: adminSheet, orders: ordersSheet, tx: txSheet, topup: topupSheet, submitTopup, terms: termsSheet, notifs: notifSheet, profile: profileSheet,
  home: () => window.scrollTo({top:0, behavior:'smooth'}),
  logout: async () => { await sb.auth.signOut(); closeSheet(); toast('ອອກຈາກລະບົບແລ້ວ', true); }
};
document.addEventListener('click', e => {
  const t = e.target;
  if (t === $('sheet')) return closeSheet();
  const cp = t.closest('[data-copy]'); if (cp) return copyText(cp.dataset.copy);
  const buy = t.closest('[data-buy]'); if (buy) return buySheet(buy.dataset.buy);
  const cf = t.closest('[data-confirm]'); if (cf) return confirmBuy(cf.dataset.confirm, cf);
  const ad = t.closest('[data-adm]');
  if (ad){ const [k, v] = ad.dataset.adm.split(':'); return ({tab:admTab, topup:admTopup, dotopup:id => admDoTopup(id, ad), add:() => admForm(), edit:admForm, save:() => admSave(ad), back:() => adminSheet(), toggle:admToggle, delacc:admDelAcc, approve:id => admApprove(id, ad), reject:id => admReject(id, ad), savecfg:() => admSaveCfg(ad), csv:admCsv})[k]?.(v); }
  const cat = t.closest('[data-cat]'); if (cat){ S.cat = cat.dataset.cat; return renderProducts(); }
  const a = t.closest('[data-act]');
  if (a && ACT[a.dataset.act]){
    if (!$('sideMenu').classList.contains('hidden') && a.dataset.act !== 'menu') toggleMenu();
    ACT[a.dataset.act]();
  }
});
$('search').addEventListener('input', e => { S.q = e.target.value; renderProducts(); });

sb.auth.onAuthStateChange((_e, session) => {
  S.user = session?.user ?? null;
  if (_e === 'PASSWORD_RECOVERY') setTimeout(newPassSheet, 0);
  setTimeout(() => { loadProfile(); loadProducts(); }, 0);
});
loadProducts();
loadSettings();
</script>
